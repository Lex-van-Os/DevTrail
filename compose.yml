services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: devtrail-azurite
    ports:
      # Endpoints for the local Azurite services
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  devtrail-api:
    container_name: devtrail-api
    build:
      context: ./devtrail-api
    ports:
      - "8080:8080"
    environment:
      # Well-known Azurite emulator account/key (public, not a secret) — see
      # https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azurite
      ConnectionStrings__TableStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;"
    depends_on:
      - azurite

  devtrail-web:
    container_name: devtrail-web
    build:
      context: ./devtrail-web
    ports:
      - "3000:3000"
    environment:
      # Only reachable from server-side code inside the Compose network — not
      # usable directly from the browser. Revisit once devtrail-web makes real
      # API calls.
      NEXT_PUBLIC_API_URL: "http://devtrail-api:8080"
    depends_on:
      devtrail-api:
        condition: service_healthy

volumes:
  azurite-data:
