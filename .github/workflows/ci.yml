name: CI
run-name: Continuous integration script for DevTrail projects

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DevTrail.slnx

      - name: Build
        run: dotnet build DevTrail.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test devtrail-api.Tests --no-build --configuration Release

  web:
    name: Web (build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: devtrail-web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          package-json-file: devtrail-web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
          package-manager-cache: true
          cache-dependency-path: devtrail-web/pnpm-lock.yaml
          check-latest: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  infra:
    name: Infra (fmt + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: devtrail-infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.0'
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      # No backend/Azure access in CI (see issue constraints) — validates
      # syntax and internal consistency only, without touching remote state.
      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
